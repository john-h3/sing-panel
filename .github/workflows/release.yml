name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            asset: sing-panel-linux-amd64
          - target: linux/arm64
            asset: sing-panel-linux-arm64
          - target: darwin/arm64
            asset: sing-panel-darwin-arm64
          - target: windows/amd64
            asset: sing-panel-windows-amd64.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build binary
        run: |
          chmod +x build.sh
          ./build.sh '${{ matrix.target }}'

      - name: Package binary
        run: tar -czf "build/${{ matrix.asset }}.tar.gz" -C build "${{ matrix.asset }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}.tar.gz
          path: build/${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            --repo '${{ github.repository }}' \
            --title '${{ github.ref_name }}' \
            --generate-notes \
            --verify-tag \
            dist/*
